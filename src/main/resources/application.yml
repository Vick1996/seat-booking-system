server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    # An on-sale stampede opens thousands of connections at once. Tomcat's default backlog of 100 refuses
    # the overflow at the socket. A large backlog lets waiting clients queue in the kernel instead (it is
    # capped by net.core.somaxconn, 4096 here). How many connections Tomcat serves at once is sized from
    # the heap, see ConnectionLimitConfig and seat.max-connections below.
    accept-count: ${TOMCAT_ACCEPT_COUNT:10000}

spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      # 100.5 for an integer field must be rejected, not silently truncated to 100 (money is paise)
      accept-float-as-int: false
  threads:
    virtual:
      enabled: true
  datasource:
    # SPRING_DATASOURCE_URL wins (compose). Render only exposes host/port/name, so build the JDBC URL.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seats}}
    username: ${SPRING_DATASOURCE_USERNAME:seats}
    password: ${SPRING_DATASOURCE_PASSWORD:seats}
    hikari:
      # Sized under the free Postgres connection cap; excess load is shed as 429, never 5xx.
      maximum-pool-size: ${DB_POOL_SIZE:15}
      # Waiting is cheap on virtual threads, so queue generously: losers of a race should get a
      # clean 409, not a 429. 20,000 requests through 15 connections wait a long time (~40s on a
      # laptop, longer on a small host), and a 20s limit shed 674 of them. This bound is the last
      # resort that sheds load as 429 (never 5xx), e.g. when the DB is genuinely stuck.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:120000}
      connection-init-sql: SET lock_timeout='10s'; SET statement_timeout='30s'
      data-source-properties:
        connectTimeout: 5   # seconds; a dead host must not hang a connect
        socketTimeout: 60   # seconds; above statement_timeout, so only a truly hung socket trips it
  flyway:
    enabled: true

logging:
  # The same JSON also goes to a file, so GET /ops/logs can serve the recent lines publicly (the platform
  # offers no public log view). Size-capped, so it cannot fill the disk.
  file:
    name: ${SEAT_LOG_FILE:${java.io.tmpdir}/seat-reservation.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      total-size-cap: 20MB
      max-history: 1
  structured:
    format:
      console: ecs # JSON; MDC (request_id, user_id) is included automatically
      file: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  observations:
    enable:
      # Spring Security times every filter in the chain on every request. Measured at the same load it cost ~10%
      # throughput (app CPU 151% -> 131%) for 52 metric lines nothing here uses. HTTP request latency and status
      # metrics (http_server_requests) are deliberately KEPT: they are what a 2am page on 5xx or p99 reads. Turning
      # those off too bought a further ~9%; opt in with SPRING_APPLICATION_JSON if CPU matters more than that.
      "[spring.security]": false
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # Readiness actually checks the DB and fails closed (503) when it is unreachable.
        readiness:
          include: readinessState,seatDb

seat:
  jwt-secret: ${SEAT_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
  admin-key: ${SEAT_ADMIN_KEY:dev-admin-key}
  # 0 = size the concurrent-connection cap from the JVM heap (recommended); a positive number overrides it.
  max-connections: ${SEAT_MAX_CONNECTIONS:0}
