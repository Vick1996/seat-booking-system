server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
  threads:
    virtual:
      enabled: true
  datasource:
    # Render supplies DATABASE_URL-style parts; compose/local use the defaults below.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/seats}
    username: ${SPRING_DATASOURCE_USERNAME:seats}
    password: ${SPRING_DATASOURCE_PASSWORD:seats}
    hikari:
      # Sized under the free Postgres connection cap; excess load is shed as 429, never 5xx.
      maximum-pool-size: ${DB_POOL_SIZE:15}
      connection-timeout: 2000
      # Bounded waits: a lock/statement that can't finish in time is shed as 429, never a hang or 5xx.
      connection-init-sql: SET lock_timeout='3s'; SET statement_timeout='10s'
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # Readiness actually checks the DB and fails closed (503) when it is unreachable.
        readiness:
          include: readinessState,db

seat:
  jwt-secret: ${SEAT_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
  admin-key: ${SEAT_ADMIN_KEY:dev-admin-key}
  hold-ttl-seconds: 120
