server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
  threads:
    virtual:
      enabled: true
  datasource:
    # SPRING_DATASOURCE_URL wins (compose). Render only exposes host/port/name, so build the JDBC URL.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seats}}
    username: ${SPRING_DATASOURCE_USERNAME:seats}
    password: ${SPRING_DATASOURCE_PASSWORD:seats}
    hikari:
      # Sized under the free Postgres connection cap; excess load is shed as 429, never 5xx.
      maximum-pool-size: ${DB_POOL_SIZE:15}
      # Waiting is cheap on virtual threads, so queue generously: losers of a race should get a
      # clean 409, not a 429. These bounds are the last resort that sheds load as 429 (never 5xx).
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:20000}
      connection-init-sql: SET lock_timeout='10s'; SET statement_timeout='30s'
      data-source-properties:
        connectTimeout: 5   # seconds; a dead host must not hang a connect
        socketTimeout: 60   # seconds; above statement_timeout, so only a truly hung socket trips it
  flyway:
    enabled: true

logging:
  structured:
    format:
      console: ecs # JSON; MDC (request_id, user_id) is included automatically

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # Readiness actually checks the DB and fails closed (503) when it is unreachable.
        readiness:
          include: readinessState,seatDb

seat:
  jwt-secret: ${SEAT_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
  admin-key: ${SEAT_ADMIN_KEY:dev-admin-key}
